<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — NeuroLearn AI</title>
    <meta name="description" content="Sign in to your NeuroLearn AI account to resume your adaptive learning journey.">
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flowbite CSS -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #090a10;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(17, 20, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card:hover {
            border-color: rgba(139, 92, 246, 0.35);
            box-shadow: 0 12px 30px -10px rgba(124, 58, 237, 0.2);
        }

        .glass-nav {
            background: rgba(9, 10, 16, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .gradient-text {
            background: linear-gradient(135deg, #a78bfa 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glow-orb-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-brand-500/30 selection:text-brand-200">

    <!-- Ambient Glow -->
    <div class="glow-orb-1"></div>

    <!-- Navigation Bar (Stable 3-Zone Flex Layout) -->
    <header class="glass-nav sticky top-0 z-50 transition-all duration-200">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto px-4 py-3.5">
            
            <!-- Left Zone: Logo & Mobile Toggle -->
            <div class="flex items-center justify-between w-full md:w-auto md:flex-1">
                <a href="../../index.html" class="flex items-center group">
                    <img src="../../assets/logo.png" class="h-9 w-9 object-contain mr-2.5 transition-transform duration-300 group-hover:scale-105" alt="NeuroLearn AI Logo" style="filter:drop-shadow(0 2px 8px rgba(124,58,237,0.3));">
                    <span class="self-center text-xl font-bold whitespace-nowrap tracking-tight text-white group-hover:text-brand-300 transition-colors">
                        NeuroLearn <span class="gradient-text font-extrabold">AI</span>
                    </span>
                </a>
                
                <button data-collapse-toggle="navbar-default" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-slate-400 rounded-xl md:hidden hover:bg-white/5 hover:text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50" aria-controls="navbar-default" aria-expanded="false">
                    <span class="sr-only">Open main menu</span>
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
                    </svg>
                </button>
            </div>
            
            <!-- Center Zone: Nav Links -->
            <nav class="hidden w-full md:block md:w-auto md:absolute md:left-1/2 md:-translate-x-1/2" id="navbar-default">
                <ul class="font-medium flex flex-col p-4 md:p-1 mt-4 border border-white/10 rounded-2xl bg-slate-900/90 md:flex-row md:space-x-1 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-transparent">
                    <li>
                        <a href="../../index.html" class="block py-2 px-3.5 text-sm font-medium rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition-colors">Home</a>
                    </li>
                    <li>
                        <a href="about.html" class="block py-2 px-3.5 text-sm font-medium rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition-colors">About</a>
                    </li>
                    <li>
                        <a href="contact.html" class="block py-2 px-3.5 text-sm font-medium rounded-xl text-slate-300 hover:text-white hover:bg-white/5 transition-colors">Contact</a>
                    </li>
                    <li>
                        <a href="../../app.html" class="block py-2 px-3.5 text-sm font-bold rounded-xl text-brand-300 hover:text-white hover:bg-brand-500/20 transition-all flex items-center gap-1.5">
                            <span>Launch App</span>
                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Right Zone: Auth Buttons / User Profile -->
            <div class="hidden md:flex md:flex-1 justify-end items-center">
                <div id="auth-buttons" class="flex items-center space-x-3" style="display:none;">
                    <a href="signin.html" class="text-white bg-white/10 text-sm font-semibold px-4 py-2 rounded-xl border border-white/15 transition-all duration-200">
                        Sign In
                    </a>
                    <a href="signup.html" class="text-white bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-sm font-semibold px-4 py-2 rounded-xl shadow-md shadow-brand-700/30 hover:shadow-brand-600/50 hover:scale-[1.02] active:scale-95 transition-all duration-200">
                        Sign Up Free
                    </a>
                </div>
                <div id="user-profile" class="flex items-center space-x-3" style="display:none;">
                    <div class="flex items-center space-x-2 bg-white/5 px-3 py-1.5 rounded-xl border border-white/10">
                        <span class="text-sm text-slate-300">👋 Hi, <span id="user-name" class="text-brand-300 font-semibold"></span></span>
                    </div>
                    <button onclick="signOut()" class="text-slate-300 hover:text-rose-400 bg-white/5 hover:bg-rose-500/10 border border-white/10 hover:border-rose-500/30 font-medium rounded-xl text-xs px-3 py-2 transition-all">
                        Log out
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            
            <!-- Error Alert -->
            <div id="error-alert" class="hidden flex items-center p-4 mb-5 text-sm text-rose-300 rounded-xl bg-rose-950/70 border border-rose-500/30" role="alert">
                <svg class="flex-shrink-0 inline w-4 h-4 mr-3 text-rose-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
                </svg>
                <div>
                    <span class="font-semibold">Error:</span> Invalid email or password.
                </div>
            </div>

            <div class="glass-card rounded-3xl p-8 sm:p-10 border border-brand-500/20 shadow-2xl">
                <div class="text-center mb-8">
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                        Welcome Back
                    </h1>
                    <p class="text-sm text-slate-400 mt-2">
                        Sign in to continue your personalized learning path
                    </p>
                </div>

                <form class="space-y-5" action="#">
                    <div>
                        <label for="email" class="block mb-2 text-xs font-semibold text-slate-300 uppercase tracking-wider">Email Address</label>
                        <input type="email" name="email" id="email" class="w-full px-4 py-3 text-sm rounded-xl bg-slate-950/80 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition" placeholder="name@company.com" required>
                    </div>
                    <div>
                        <label for="password" class="block mb-2 text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                        <input type="password" name="password" id="password" placeholder="••••••••" class="w-full px-4 py-3 text-sm rounded-xl bg-slate-950/80 border border-white/10 text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition" required>
                    </div>
                    <div class="flex items-center justify-between text-xs">
                        <label class="flex items-center text-slate-400 cursor-pointer">
                            <input id="remember" type="checkbox" class="w-4 h-4 rounded bg-slate-900 border-white/20 text-brand-600 focus:ring-brand-500 focus:ring-offset-slate-900 mr-2">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="font-medium text-brand-400 hover:text-brand-300 transition">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="w-full py-3.5 px-4 text-sm font-bold text-white rounded-xl bg-gradient-to-r from-brand-600 via-indigo-600 to-purple-600 hover:from-brand-500 hover:to-purple-500 shadow-lg shadow-brand-600/30 hover:scale-[1.02] active:scale-95 transition-all duration-200">
                        Sign In
                    </button>
                    
                    <p class="text-xs text-slate-400 text-center pt-2">
                        Don't have an account? <a href="signup.html" class="font-semibold text-brand-400 hover:text-brand-300 underline">Sign up free</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 bg-slate-950/80 py-8 px-4 relative z-10 text-center text-xs text-slate-400">
        <p>© 2026 NeuroLearn™ AI. All rights reserved.</p>
    </footer>

    <!-- Flowbite Script -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL  = 'https://aymtysjgkhexxtjgqiom.supabase.co';
        const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5bXR5c2pna2hleHh0amdxaW9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTgwODYsImV4cCI6MjEwNTQ3NDA4Nn0.fIYReDqrtqssdjPgA5VmQ8BqpoplVmAG5LVPgZem1b8';
        window._supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        const form       = document.querySelector('form');
        const errorAlert = document.getElementById('error-alert');
        const errorMsg   = errorAlert.querySelector('div');
        const submitBtn  = form.querySelector('button[type="submit"]');

        function showError(msg) {
            errorMsg.innerHTML = `<span class="font-semibold">Error:</span> ${msg}`;
            errorAlert.classList.remove('hidden');
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            errorAlert.classList.add('hidden');
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            const { error } = await window._supabase.auth.signInWithPassword({ email, password });

            if (error) {
                showError(error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            } else {
                window.location.href = '../../index.html';
            }
        });
    </script>
    <script src="../../assets/auth.js"></script>
</body>
</html>
